<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>QuickNotes</title>
        <link rel="stylesheet" href="style.css" />
        <script src="index.js" defer></script>
    </head>

    <body>
        <header>
            <h1 class="site-title" id="my-site-title">QuickNotes</h1>
            <p>capture ideas before they disappear</p>

            <nav>
                <ul>
                    <li class="pudi" id="my-pudi-id"><a href="index.html">home</a></li>
                    <li class="pudi" id="my-pudi-id"><a href="about.html">about</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section>
                <h2>add a note</h2>

                <form id="note-form">
                    <label for="note-input">new note</label>

                    <input
                        type="text"
                        id="note-input"
                        name="note"
                        placeholder="type a note..."
                    />
                    <button type="submit">Add note</button>
                </form>
            </section>

            <section>
                <h2>your notes</h2>

                <p id="note-count">you have 2 notes</p>

                <ul id="note-list">
                    <li>revise html forms</li>
                    <li>push code to github</li>
                </ul>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
        </footer>
    </body>
</html>
